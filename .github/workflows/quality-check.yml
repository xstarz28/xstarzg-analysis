name: XStarZG Quality Checks

on:
  push:
    branches:
      - main
      - fix/manual-analysis-only-clean-journal
  pull_request:
    branches:
      - main
      - fix/manual-analysis-only-clean-journal

permissions:
  contents: read

jobs:
  node-tests:
    name: Static, journal, and Sentinel regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check core JavaScript and test syntax
        run: |
          node --check public/app.js
          node --check public/js/app.js
          node --check tests/app-static.test.mjs
          node --check tests/journal-segments-and-execution.test.mjs
          node --check tests/journal-sync-account-scope.test.mjs
          node --check tests/manual-dex-analysis.test.mjs
          node --check tests/manual-signal-lock-journal-integration.test.mjs
          node --check tests/sentinel-journal-fix.test.mjs
          node --check public/js/engine-boot.js
          node --check public/js/shared/signal-engine.js
          node --check scripts/market-sentinel.mjs
          node --check functions/api/dex/analysis.js
          node --check functions/api/market/journal-sync.js
          node --check functions/api/market/price-alarms.js
          node --check tests/telegram-bot-alerts.test.mjs
          node --check tests/telegram-vip.test.mjs
          node --check tests/owner-access.test.mjs
          node --check functions/api/auth/owner.js
          node --check functions/api/billing/verify-bsc.js
          node --check functions/api/notify/telegram.js
          node --check functions/api/notify/telegram-link.js
          node --check functions/api/notify/telegram-subscribers.js
          node --check functions/api/notify/telegram-webhook.js
          node --check public/js/shared/group-analysis.js
      - name: Verify workspace UI and manual-only analysis
        run: node tests/app-static.test.mjs
      - name: Verify manual journal and reset invariants
        run: node tests/journal-segments-and-execution.test.mjs
      - name: Verify cloud journal and Sentinel safeguards
        run: node tests/sentinel-journal-fix.test.mjs
      - name: Verify manual DEX and account-scoped cloud journal
        run: node --test tests/manual-dex-analysis.test.mjs tests/journal-sync-account-scope.test.mjs tests/manual-signal-lock-journal-integration.test.mjs
      - name: Verify timeframe signal engine regressions
        run: node --test tests/engine-v2.test.mjs
      - name: Verify per-group sniper multi-timeframe analysis
        run: node --test tests/group-analysis.test.mjs
      - name: Verify Telegram bot journal and bell alerts
        run: node --test tests/telegram-bot-alerts.test.mjs
      - name: Verify Telegram VIP gating, payment relay and anti-spoof hardening
        run: node tests/telegram-vip.test.mjs
      - name: Verify owner login is fail-closed without a committed access code
        run: node tests/owner-access.test.mjs
