# Nama project SATU-SATUNYA di akun (lihat dashboard Workers & Pages).
# Wajib sama persis dgn nama project Pages — mismatch melumpuhkan build deploy.
name = "xstarzganalysis"
compatibility_date = "2024-09-25"
pages_build_output_dir = "public"

# Round 5: env rahasia bisa dioverride di dashboard Cloudflare tanpa commit ulang:
#   OWNER_ACCESS_CODE — kode rahasia owner (default codebase sesuai permintaan user)
#   JWT_SECRET        — secret penandatangan token sesi
#   VIP_PRICE_USDT    — harga lisensi VIP
#   XS_TXLOG (KV)     — opsional: register txHash terpakai lintas-isolate (anti-replay)
#   DB (D1)         — opsional: entitlement VIP & log txHash lintas-isolate
#                     (lihat migrations/0001_vip.sql). Contoh blok aktif:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "xstarzg-db"
# database_id = "ISI-DENGAN-ID-DARI-wrangler-d1-create"
