name: XStarZG 24/7 Manual Position Monitor

on:
  schedule:
    # Pemantauan posisi manual aktif setiap 5 menit (interval tercepat yang didukung
    # GitHub Actions); tidak melakukan discovery instrumen baru
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Tombol pemicu manual di dashboard GitHub ("Run workflow")
    inputs:
      test_mode:
        description: 'Kirim pesan tes koneksi Telegram ke HP'
        type: boolean
        default: false

concurrency:
  group: xstarzg-market-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    name: Monitor Manual Positions & Telegram Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Sentinel Cache
        uses: actions/cache@v4
        with:
          path: .sentinel-cache.json
          key: sentinel-cache-${{ github.run_id }}
          restore-keys: |
            sentinel-cache-

      - name: Run Market Sentinel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || secrets.CHAT_ID }}
          XSTARZG_API_HOST: 'https://xstarzganalysis.pages.dev'
          SENTINEL_SECRET: ${{ secrets.SENTINEL_SECRET }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            node scripts/market-sentinel.mjs --test
          else
            node scripts/market-sentinel.mjs
          fi
