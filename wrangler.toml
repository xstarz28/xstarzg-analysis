name = "xstarzganalysis"
# Nama ini WAJIB sama persis dengan nama project Pages di dashboard Cloudflare.
# Project aktif (satu-satunya): xstarzganalysis -> https://xstarzganalysis.pages.dev
# Mismatch nama project vs field ini adalah penyebab build preview tergantung.
compatibility_date = "2024-09-25"
pages_build_output_dir = "public"

# Env rahasia diset/disalin di dashboard Cloudflare (Settings -> Variables and Secrets):
#   OWNER_ACCESS_CODE — kode rahasia owner (default codebase sesuai permintaan user)
#   JWT_SECRET        — secret penandatangan token sesi
#   VIP_PRICE_USDT    — harga lisensi VIP
#   GOOGLE_CLIENT_ID  — login Google (tambahkan origin xstarzganalysis.pages.dev di Google Console)
#   XS_TXLOG (KV)     — opsional: register txHash terpakai lintas-isolate (anti-replay)
